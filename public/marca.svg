<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Administrativo">
  <!--
    Marca: o coloană de ore care se închide pe linia de total. Patru bare de
    înălțimi diferite pe o riglă groasă — obiectul pe care îl vinde produsul.
    Navy pe crem, culorile aplicației, ca pictograma din bara de file să fie
    aceeași cu ecranul în care duce.
  -->
  <rect width="24" height="24" fill="#0F1E3D"/>
  <g fill="#FAF7F0">
    <rect x="4" y="9.5" width="2.5" height="7"/>
    <rect x="8.4" y="5.5" width="2.5" height="11"/>
    <rect x="12.8" y="11" width="2.5" height="5.5"/>
    <rect x="17.2" y="7.5" width="2.5" height="9"/>
    <rect x="4" y="18" width="15.7" height="2"/>
  </g>
</svg>
