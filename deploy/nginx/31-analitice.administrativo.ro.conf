# analitice.administrativo.ro — Umami, măsurare fără cookie-uri.
#
# Sursa de adevăr e ACEST fișier, din repo. Se instalează în
# /srv/apps/Strawboss/nginx/conf.d/ împreună cu vhost-ul aplicației.
#
# ── DE CE UN SUBDOMENIU PROPRIU, ȘI NU O CALE PE administrativo.ro ─────────
# Umami e o aplicație separată, cu baza ei. Montată pe o cale (`/analitice`),
# ar fi trebuit rescrisă în proxy și ar fi împărțit originea cu aplicația —
# adică și cookie-urile, și CSP-ul, și orice greșeală de rutare.
#
# ── ORDINEA DE PORNIRE, CARE NU E EVIDENTĂ ────────────────────────────────
# Blocul 443 de mai jos referă un certificat care NU există înainte de prima
# emitere, iar `nginx -t` cade pe un `ssl_certificate` inexistent — ceea ce ar
# bloca reload-ul TUTUROR site-urilor de pe VM, nu doar al acestuia.
#
# Certificatul se emite ÎNAINTE de a instala fișierul ăsta. Se poate, fiindcă
# nginx n-are `default_server`: gazda nepotrivită cade pe primul bloc `:80`
# încărcat (`10-nortiauno.com.conf`), care servește deja
# `/.well-known/acme-challenge/` din `/var/www/certbot`. Deci provocarea HTTP-01
# pentru `analitice.administrativo.ro` trece fără ca acest vhost să existe.
#
# Comenzile exacte sunt în README-ul de la `deploy/umami/`.

server {
    listen 80;
    server_name analitice.administrativo.ro;

    # Rămâne pe :80 și după trecerea la HTTPS: certbot reînnoiește prin HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://analitice.administrativo.ro$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name analitice.administrativo.ro;

    ssl_certificate     /etc/letsencrypt/live/analitice.administrativo.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analitice.administrativo.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_ANL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Panoul Umami NU are ce căuta într-un index de căutare: e o interfață de
    # administrare, iar adresa ei ajunge oricum publică prin scriptul de pe sit.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;

    # Rezolvarea prin variabilă, ca la vhost-ul aplicației: fără ea, nginx
    # rezolvă numele serviciului O SINGURĂ DATĂ, la pornire. Un redeploy de Swarm
    # schimbă IP-ul containerului, iar nginx continuă să trimită către cel vechi
    # până la un restart — adică o pană tăcută, care se repară „de la sine" abia
    # când repornește altcineva.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $umami_upstream http://umami:3000;

    location / {
        proxy_pass $umami_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
