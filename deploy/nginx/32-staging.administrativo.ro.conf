# staging.administrativo.ro — mediul de probă al aplicației Administrativo.
#
# Sursa de adevăr e ACEST fișier, din repo. Se instalează cu:
#   ADM_MEDIU=staging ./administrativo.sh nginx:vhost
#
# CE NU E AICI, DELIBERAT — și de ce copierea oarbă a vhost-ului de producție ar
# fi dărâmat tot VM-ul:
#
#   `log_format durate` și `map $http_upgrade $connection_upgrade` se declară în
#   contextul `http`, iar conf.d e inclus exact acolo. Sunt deja declarate în
#   30-administrativo.ro.conf. O A DOUA declarație, în orice fișier de pe VM,
#   face `nginx -t` să pice cu „duplicate log_format" / „duplicate map name" și
#   BLOCHEAZĂ reload-ul pentru toate cele zece site-uri de aici — nu doar pentru
#   acesta. Fișierul de față le FOLOSEȘTE pe amândouă (vezi `access_log … durate`
#   și `Connection $connection_upgrade` mai jos) fără să le redeclare.
#
#   Din același motiv `ssl_session_cache` are zonă proprie, `SSL_ADM_STG`: două
#   zone cu același nume ar fi tot o declarație duplicată.
#
# Ordinea de instalare e impusă de ops/06-nginx.sh: certificatul TREBUIE să
# existe înaintea acestui fișier, fiindcă un `ssl_certificate` inexistent face
# nginx să nu mai PORNEASCĂ, ceea ce e mai rău decât un reload eșuat.

# HTTP — provocarea ACME + redirect către HTTPS
server {
    listen 80;
    server_name staging.administrativo.ro;

    # Rămâne pe :80 și după trecerea la HTTPS: certbot reînnoiește prin HTTP-01,
    # iar Cloudflare transmite calea asta fără să o redirecteze. Blocul n-are
    # `auth_basic`, deci provocarea nu se lovește de parola de mai jos — ceea ce
    # ar bloca tăcut reînnoirea la 90 de zile.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://staging.administrativo.ro$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.administrativo.ro;

    ssl_certificate     /etc/letsencrypt/live/staging.administrativo.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.administrativo.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_ADM_STG:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Staging servește ACELAȘI conținut de vitrină ca situl real. Fără asta,
    # Google îl indexează și cele două domenii concurează pe exact aceleași
    # pagini — iar cel de probă câștigă uneori, fiindcă e mai nou.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Jurnal separat, în formatul `durate` declarat în vhost-ul de producție.
    access_log /dev/stdout main;
    access_log /var/log/nginx/staging.administrativo.log durate;

    # Rezolvare la REQUEST, prin variabilă: cu `proxy_pass` direct, un serviciu
    # de staging oprit ar face `nginx -t` să pice și ar da jos TOATE site-urile.
    # Așa, un upstream absent înseamnă 502 doar pe acest domeniu. Tot asta
    # permite instalarea vhost-ului înainte de primul deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 25M;

    # Supabase SSR împarte token-ul de sesiune în mai multe cookie-uri; antetele
    # Set-Cookie rezultate depășesc bufferul implicit de 4k și dau 502 exact
    # utilizatorilor autentificați.
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/json text/plain text/css application/javascript;

    # ── Setări de proxy comune ───────────────────────────────────────────────
    # Moștenirea în nginx e „înlocuire pe nivel", nu contopire: dacă un
    # `location` ar declara ORICE `proxy_set_header`, ar pierde TOATE antetele
    # de aici. De asta locațiile de mai jos n-au niciunul.
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;

    # Pagina de stare a deploy-urilor. Servită de un container SEPARAT
    # (deploy/stare-stack.yml), nu de aplicație: momentul în care ai nevoie de ea
    # e exact momentul în care aplicația nu pornește.
    #
    # FĂRĂ parolă, intenționat: e pagina pe care o cauți când nu poți intra, și
    # nu conține nimic în afară de un sha de commit și numele pasului care a
    # picat.
    location /_stare {
        auth_basic off;
        set $s stare:80;
        proxy_pass http://$s/;
    }

    # Diagnostic intern — răspunsul conține latențe și starea legăturii cu
    # Supabase, care n-au ce căuta pe internet.
    location = /readyz {
        return 404;
    }

    # Mediul de probă nu e public. Fișierul de parole e citit din INTERIORUL
    # containerului nginx, de aceea calea e cea montată (conf.d), nu cea de pe
    # gazdă — conf.d e singurul director deja montat acolo, iar un montaj nou ar
    # cere recrearea nginx-ului, adică o clipire pe toate site-urile.
    auth_basic           "Administrativo — mediu de probă";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd-staging;

    location /api/export/ {
        set $u administrativo-web-staging:3000;
        proxy_pass         http://$u;
        proxy_read_timeout 120s;
    }

    location / {
        set $u administrativo-web-staging:3000;
        proxy_pass         http://$u;
    }
}
