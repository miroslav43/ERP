# administrativo.ro — Administrativo (ERP), Next.js în Docker Swarm.
#
# Sursa de adevăr e ACEST fișier, din repo. Se instalează în
# /srv/apps/Strawboss/nginx/conf.d/ cu:  ./administrativo.sh nginx:vhost
# (care face backup, testează configul și dă reload).
#
# Istoric:
#   2026-08-21  domeniul provizoriu `infomeditatii.ro` a fost preluat de la
#               „Eduvora" (FastAPI/uvicorn pe host, systemd :8000).
#   2026-09-03  mutare pe domeniul definitiv `administrativo.ro`. Certificat
#               nou, emis de certbot-ul partajat; vhost-ul vechi a fost șters
#               împreună cu backup-ul lui `.eduvora.bak`.
#
# Mutarea nu e doar de vhost: `NEXT_PUBLIC_APP_URL` se coace în bundle-ul de
# client la `docker build`, iar `src/app/auth/callback/route.ts` îl folosește
# intenționat în locul lui `request.url`. Un vhost nou peste o imagine veche
# înseamnă login care aruncă utilizatorul pe domeniul vechi.

# Antetul `Connection` corect pentru un proxy HTTP/1.1.
#
# Până la 2026-08-23 aici scria `proxy_set_header Connection "upgrade"`,
# necondiționat: fiecare cerere obișnuită pleca spre Next cu `Connection:
# upgrade` și fără niciun `Upgrade`, adică o pereche de antete pe care RFC 9110
# n-o permite. Formula canonică e maparea de mai jos — „upgrade" doar când
# clientul chiar cere un upgrade, „close" în rest.
#
# `map` se declară în contextul `http`; fișierele din conf.d sunt incluse exact
# acolo, deci locul e valid. Numele e liber pe acest VM (verificat în toate
# vhost-urile din conf.d) — un al doilea `map $connection_upgrade` ar face
# `nginx -t` să pice cu „duplicate map name" și ar bloca reload-ul TUTUROR
# site-urilor, nu doar al acestuia. La mutarea din 3 septembrie 2026 asta a
# contat practic: cele două vhost-uri au trebuit să coexiste câteva minute, iar
# maparea a fost scoasă din cel vechi ca să rămână o singură declarație.
# `main` (implicitul nginx) n-are nici $host, nici vreo durată — de aceea seria
# istorică din `docker logs` nu se poate nici filtra pe site, nici folosi la o
# comparație înainte/după. Formatul ăsta le adaugă pe amândouă.
#
# $request_time  = de la primul octet citit de la client la ultimul trimis;
#                  include rețeaua omului. E ce SIMTE utilizatorul.
# $upstream_response_time = doar Next.js. E termenul onest pentru „am reparat".
#
# La nivel de fișier, nu în server{}: `log_format` cere contextul http, iar
# conf.d e inclus exact acolo (nginx.conf:31) — la fel ca `map` de mai jos.
# O A DOUA declarație, oriunde pe VM, face `nginx -t` să pice cu „duplicate
# log_format" și blochează reload-ul pentru toate cele 10 site-uri.
#
# $remote_addr E MARGINEA CLOUDFLARE, nu clientul — pe acest vhost nu există
# `set_real_ip_from`, deci nginx vede IP-ul edge-ului (ex. 104.23.229.134,
# 172.71.130.189), diferit la fiecare cerere a aceluiași om. Clientul real
# trăiește în antetul $http_x_forwarded_for, ultimul câmp de mai jos, între
# ghilimele (poate fi gol sau o listă separată prin virgulă). Fără el, seria
# de referință nu se poate filtra pe UN utilizator anume — al cărui drum de
# rețea (Timișoara → Frankfurt) diferă de roboți, sonde de sănătate și
# crawler-e — ceea ce era chiar rostul ei.
log_format durate '$remote_addr $host "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time "$http_x_forwarded_for"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP — provocarea ACME + redirect către HTTPS
server {
    listen 80;
    server_name administrativo.ro www.administrativo.ro;

    # Rămâne pe :80 și după trecerea la HTTPS: certbot reînnoiește prin HTTP-01,
    # iar Cloudflare transmite calea asta fără să o redirecteze.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://administrativo.ro$request_uri;
    }
}

# www → apex, permanent.
#
# Nu e cosmetică: `NEXT_PUBLIC_APP_URL` copt în bundle e apexul, iar callback-ul
# de autentificare trimite acolo necondiționat. Dacă www ar servi aplicația,
# un utilizator care se loghează pe www primește cookie-urile de sesiune pe
# `www.administrativo.ro`, apoi e mutat pe apex — unde acele cookie-uri nu se
# trimit. Rezultatul e un login care „reușește" și totuși lasă utilizatorul
# delogat, fără niciun mesaj de eroare.
server {
    listen 443 ssl;
    http2 on;
    server_name www.administrativo.ro;

    ssl_certificate     /etc/letsencrypt/live/administrativo.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/administrativo.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://administrativo.ro$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name administrativo.ro;

    ssl_certificate     /etc/letsencrypt/live/administrativo.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/administrativo.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_ADM:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Două destinații, deliberat. Prima păstrează comportamentul de dinainte
    # (o directivă access_log în server{} SUPRASCRIE moștenirea din http, nu o
    # completează). A doua e seria de referință pentru lucrul la latență.
    #
    # NU trimite `durate` tot în /dev/stdout: jurnalul json-file al nginx are
    # deja 780 MB, fără max-size, pe un disc ocupat 81%.
    access_log /dev/stdout main;
    access_log /var/log/nginx/administrativo.log durate;

    # Rezolvarea numelui se face la REQUEST, nu la încărcarea configului, fiindcă
    # upstream-ul e într-o variabilă. Diferența contează: cu `proxy_pass` direct,
    # un serviciu oprit ar face `nginx -t` să pice și reload-ul ar da jos TOATE
    # site-urile de pe VM. Așa, un upstream absent înseamnă doar 502 pe acest
    # domeniu. Tot asta permite instalarea vhost-ului înainte de primul deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Bucket-ul `org-documents` acceptă 25 MB per fișier (vezi 0002_authz.sql);
    # implicitul nginx de 1 MB ar respinge încărcările cu 413 înainte să ajungă
    # la aplicație.
    client_max_body_size 25M;

    # Supabase SSR împarte token-ul de sesiune în mai multe cookie-uri, iar
    # antetele Set-Cookie rezultate depășesc bufferul implicit de 4k. Fără
    # mărire, nginx răspunde „upstream sent too big header" → 502 exact
    # utilizatorilor autentificați, în timp ce paginile publice merg perfect.
    # Aceeași reparație ca la buget.scoala-ai.ro (tot Next.js + Supabase).
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/json text/plain text/css application/javascript;

    # ── Setări de proxy comune ───────────────────────────────────────────────
    # Declarate la nivel de `server` și moștenite de fiecare `location` de mai
    # jos. Moștenirea în nginx e „înlocuire pe nivel", nu contopire: dacă un
    # `location` ar declara ORICE `proxy_set_header` al lui, ar pierde TOATE
    # antetele de aici. De asta locațiile de mai jos nu au niciunul.
    proxy_http_version 1.1;

    # Server Actions și streamingul RSC merg pe conexiuni lungi.
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Fără asta, Next.js s-ar crede pe http și ar genera linkuri absolute
    # greșite; tot de aici își ia și cookie-urile atributul Secure.
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;

    # Cât așteaptă nginx ANTETUL de răspuns de la Next.
    #
    # A fost 120s peste tot. Pe 23 august 2026 asta a însemnat că fiecare cerere
    # agățată ținea browserul două minute înainte să arate 504. Aplicația are
    # acum termen propriu de 10s pe apelurile către Supabase
    # (src/lib/supabase/fetch-cu-termen.ts), deci un blocaj din cauza aia nici
    # nu mai ajunge aici — pragul de mai jos rămâne doar ca plasă.
    #
    # 60s, nu 30s: `salarizare`, `angajati/import` și crearea de organizații fac
    # scrieri în lot care pot dura legitim zeci de secunde, iar o Server Action
    # tăiată la jumătate e mai rea decât una lentă.
    #
    # Plafonul real e oricum al Cloudflare: 524 după 100s. Orice valoare peste
    # atât e literă moartă pentru traficul care vine prin ei — adică tot.
    proxy_read_timeout 60s;

    # Diagnostic intern: sonda de disponibilitate a containerului. Healthcheck-ul
    # Swarm o cheamă pe 127.0.0.1:3000 din interiorul containerului, deci n-are
    # nevoie de drum public — iar răspunsul ei conține latențe și starea
    # legăturii cu Supabase, care n-au ce căuta pe internet.
    location = /readyz {
        return 404;
    }

    # Exporturile Excel și D112 se construiesc în memorie (exceljs) și pot
    # depăși pragul general. Singura diferență față de `location /` e termenul;
    # tot restul se moștenește de mai sus.
    location /api/export/ {
        set $u administrativo-web:3000;
        proxy_pass         http://$u;
        proxy_read_timeout 120s;
    }

    location / {
        set $u administrativo-web:3000;
        proxy_pass         http://$u;
    }
}
