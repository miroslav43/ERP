# infomeditatii.ro — Administrativo (ERP), Next.js în Docker Swarm.
#
# Sursa de adevăr e ACEST fișier, din repo. Se instalează în
# /srv/apps/Strawboss/nginx/conf.d/ cu:  ./administrativo.sh nginx:vhost
# (care face backup, testează configul și dă reload).
#
# Istoric: până la 2026-08-21 domeniul servea „Eduvora" (FastAPI/uvicorn pe host,
# systemd infomeditatii.service:8000). Vechiul fișier rămâne salvat lângă cel
# instalat, ca .eduvora.bak. Revenire: ./administrativo.sh nginx:restore
#
# Certificatul e cel emis pentru Eduvora și e refolosit: același domeniu,
# aceeași filiație Let's Encrypt. Nu s-a rulat certbot la migrare.

# HTTP — provocarea ACME + redirect către HTTPS
server {
    listen 80;
    server_name infomeditatii.ro www.infomeditatii.ro;

    # Rămâne pe :80 și după trecerea la HTTPS: certbot reînnoiește prin HTTP-01,
    # iar Cloudflare transmite calea asta fără să o redirecteze.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name infomeditatii.ro www.infomeditatii.ro;

    ssl_certificate     /etc/letsencrypt/live/infomeditatii.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infomeditatii.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_INFOM:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Rezolvarea numelui se face la REQUEST, nu la încărcarea configului, fiindcă
    # upstream-ul e într-o variabilă. Diferența contează: cu `proxy_pass` direct,
    # un serviciu oprit ar face `nginx -t` să pice și reload-ul ar da jos TOATE
    # site-urile de pe VM. Așa, un upstream absent înseamnă doar 502 pe acest
    # domeniu. Tot asta permite instalarea vhost-ului înainte de primul deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Bucket-ul `org-documents` acceptă 25 MB per fișier (vezi 0002_authz.sql);
    # implicitul nginx de 1 MB ar respinge încărcările cu 413 înainte să ajungă
    # la aplicație.
    client_max_body_size 25M;

    # Supabase SSR împarte token-ul de sesiune în mai multe cookie-uri, iar
    # antetele Set-Cookie rezultate depășesc bufferul implicit de 4k. Fără
    # mărire, nginx răspunde „upstream sent too big header" → 502 exact
    # utilizatorilor autentificați, în timp ce paginile publice merg perfect.
    # Aceeași reparație ca la buget.scoala-ai.ro (tot Next.js + Supabase).
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/json text/plain text/css application/javascript;

    location / {
        set $u administrativo-web:3000;
        proxy_pass         http://$u;
        proxy_http_version 1.1;

        # Server Actions și streamingul RSC merg pe conexiuni lungi.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Fără asta, Next.js s-ar crede pe http și ar genera linkuri absolute
        # greșite; tot de aici își ia și cookie-urile atributul Secure.
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Exporturile Excel pe organizații mari (exceljs construiește fișierul
        # în memorie) pot depăși implicitul de 60s.
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }
}
