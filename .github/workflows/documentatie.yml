# Sincronizarea nocturnă a vault-ului `.claude/docs/`.
#
# DE CE NU `on: push`: workflow-ul trage din ACELAȘI `CLAUDE_CODE_OAUTH_TOKEN` ca
# `revizuire.yml`, care e poarta de securitate RLS. La cadența măsurată a repo-ului
# (vârf de 80 de commit-uri/zi), per-push ar cere zeci de invocări Opus pe zi, iar
# când cota se termină cade revizuirea ca să plătească documentația. Nocturn: o
# rulare pe zi, previzibilă.
#
# DE CE NU `anthropics/claude-code-action`: același motiv ca la `revizuire.yml` —
# acțiunea nu suportă evenimentul `push`, iar token-ul ei de GitHub App
# re-declanșează workflow-uri. Rulăm CLI-ul direct.

name: Documentație

on:
  # ÎN LANȚ după `Revizuire`, nu pe cron propriu.
  #
  # Aici a fost `cron: "37 2 * * *"` — același minut cu al revizuirii — plus o
  # gardă care ceda dacă revizuirea rula chiar atunci. Garda a și cedat, pe 3
  # septembrie: rularea a durat 12 secunde, a raportat `success`, și n-a scris
  # nimic, fiindcă „se reia mâine”. Două rulări programate la aceeași oră, cu o
  # gardă care rezolvă coliziunea sărind una dintre ele, nu sunt o secvență —
  # sunt o cursă cu un învins tăcut.
  #
  # `workflow_run` face ordinea structurală: documentația nici nu poate porni
  # până nu s-a terminat revizuirea, inclusiv jobul ei de reparare. Nu mai
  # există gardă fiindcă nu mai există ce păzi.
  workflow_run:
    workflows: ["Revizuire"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pagini:
        description: "Pagini forțate, separate prin virgulă (gol = triajul decide)"
        default: ""
      uscat:
        description: "Scrie și verifică, dar NU comite"
        type: boolean
        default: false

concurrency:
  group: documentatie-${{ github.event_name }}
  cancel-in-progress: false

permissions: {}

env:
  VERSIUNE_CLAUDE: "2.1.238"
  VERSIUNE_NODE: "22"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Ce merită rescris — calculat FĂRĂ LLM. Dacă lista iese goală, nu se cheltuie
  # nimic: plata ca să afli că n-ai ce face e exact tiparul pe care îl evităm.
  # ───────────────────────────────────────────────────────────────────────────
  triaj:
    name: Triaj — ce pagini s-au învechit
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # NU se filtrează pe `conclusion == 'success'`. `Revizuire` iese cu 1 ori de
    # câte ori rămân findings critical/high — ăsta e semnalul ei normal de lucru,
    # nu un eșec. Un filtru pe succes ar fi oprit documentația exact în zilele cu
    # constatări reale, adică exact în zilele în care codul s-a mișcat cel mai
    # mult. Se filtrează doar ramura.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      actions: read
    outputs:
      rulam: ${{ steps.decide.outputs.rulam }}
      # „Am apucat să evaluez starea" — adevărat și când nu e nimic de rescris.
      # Jurnalul zilei atârnă de ăsta, nu de `rulam`: o noapte fără pagini
      # învechite e tot o noapte în care rutina a rulat, și asta trebuie să se vadă.
      activ: ${{ steps.decide.outputs.activ }}
      motiv: ${{ steps.decide.outputs.motiv }}
      pagini: ${{ steps.decide.outputs.pagini }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      # fetch-depth: 0 — prospețimea se calculează din `git log`. Într-o clonă
      # superficială ar întoarce gol pentru orice și triajul ar raporta senin
      # „totul e proaspăt". `triaj.mjs` are și o santinelă pentru cazul ăsta.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # `main`, nu `github.sha`. Pe `workflow_run`, `github.sha` e vârful pe
          # care a PORNIT revizuirea — dinainte ca jobul ei de reparare să
          # împingă. Fără asta, documentația ar descrie cod care nu mai există.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSIUNE_NODE }}

      # Aici stătea pasul „Documentația cedează revizuirii”, care întreba dacă o
      # revizuire rulează CHIAR ACUM și, dacă da, ieșea cu „se reia mâine”.
      # Bariera apăra cota de abonament, comună cu `revizuire.yml`, împotriva a
      # două rulări Opus în paralel. Cu declanșatorul `workflow_run` de mai sus,
      # paralelismul nu mai e posibil: documentația pornește abia după ce
      # revizuirea s-a încheiat. Bariera a fost ștearsă, nu dezactivată — o gardă
      # care nu mai poate fi adevărată e doar un pas care minte în jurnal.

      - name: Decide
        id: decide
        env:
          # Doar PREZENȚA secretului, niciodată valoarea: expresia se evaluează la
          # "true"/"false", secretul nu ajunge în mediu.
          ARE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          FORTATE: ${{ inputs.pagini }}
          ACTIV: ${{ vars.DOCS_ACTIV }}
        run: |
          set -uo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$ARE_TOKEN" != "true" ]; then
            { echo "rulam=false"; echo "motiv=CLAUDE_CODE_OAUTH_TOKEN nu e configurat"; } >> "$GITHUB_OUTPUT"
            echo "::notice::Sincronizarea e sărită: adaugă secretul CLAUDE_CODE_OAUTH_TOKEN."
            exit 0
          fi
          if [ "${ACTIV:-true}" = "false" ]; then
            { echo "rulam=false"; echo "motiv=DOCS_ACTIV=false"; } >> "$GITHUB_OUTPUT"
            echo "::notice::Întrerupătorul de urgență e pe oprit."
            exit 0
          fi

          if [ -n "$FORTATE" ]; then
            lista=$(echo "$FORTATE" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' \
              | jq -R . | jq -sc .)
          else
            lista=$(node scripts/docs/triaj.mjs --json | jq -c '[.alese[].pagina]')
          fi
          n=$(echo "$lista" | jq 'length')
          echo "pagini=$lista" >> "$GITHUB_OUTPUT"
          echo "activ=true" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then
            { echo "rulam=false"; echo "motiv=nicio pagină învechită"; } >> "$GITHUB_OUTPUT"
            echo "::notice::Vault-ul e la zi — se scrie doar jurnalul zilei."
          else
            { echo "rulam=true"; echo "motiv=$n pagini"; } >> "$GITHUB_OUTPUT"
          fi
          node scripts/docs/triaj.mjs >> "$GITHUB_STEP_SUMMARY"
          # Triajul spune ce s-a învechit. Întrebarea complementară — ce s-a
          # construit și n-are pagină deloc — n-are cine s-o pună: o pagină care nu
          # există nu poate fi marcată învechită.
          ZILE_ACOPERIRE=1 node scripts/docs/acoperire.mjs >> "$GITHUB_STEP_SUMMARY" || true

  # ───────────────────────────────────────────────────────────────────────────
  # O pagină, un job. `contents: read`, fără credențiale git, FĂRĂ `Bash`.
  #
  # Diff-ul e text controlat de cine a scris commit-ul, iar promptul îi cere
  # agentului să-l citească. Fără Bash, fără credențial persistat și fără
  # `contents: write`, o directivă strecurată într-un diff n-are unealtă.
  # ───────────────────────────────────────────────────────────────────────────
  pagina:
    name: ${{ matrix.pagina }}
    needs: triaj
    if: needs.triaj.outputs.rulam == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pagina: ${{ fromJSON(needs.triaj.outputs.pagini) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # `main`, nu `github.sha`. Pe `workflow_run`, `github.sha` e vârful pe
          # care a PORNIT revizuirea — dinainte ca jobul ei de reparare să
          # împingă. Fără asta, documentația ar descrie cod care nu mai există.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSIUNE_NODE }}

      - name: Instalează Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$VERSIUNE_CLAUDE"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pregătește materialul
        id: material
        env:
          PAGINA: ${{ matrix.pagina }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/lucru"
          mkdir -p "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          vechi=$(sed -n 's/^scris_pe: *//p' "$PAGINA" | head -1)
          cai=$(sed -n '/^cai:/,/^[a-z_]*:/p' "$PAGINA" | sed -n 's/^  - *"\(.*\)"$/\1/p')
          echo "vechi=$vechi" >> "$GITHUB_OUTPUT"

          # `git diff`, niciodată `git log -p`: mesajele de commit nu intră în
          # material. Vault-ul se exclude — altfel agentul își citește propria ieșire.
          # shellcheck disable=SC2086
          git diff "$vechi..HEAD" -- $cai ':(exclude).claude/docs' > "$DIR/diff.patch" || true
          wc -c < "$DIR/diff.patch"

          # Mărimea corpului, MĂSURATĂ de lint (aceeași regulă ca poarta), dată
          # agentului în prompt: n-are `Bash`, deci n-o poate număra singur.
          # Subpaginile unei spargeri stau în `<pagina fără .md>/`.
          echo "subdir=${PAGINA%.md}" >> "$GITHUB_OUTPUT"
          node scripts/docs/lint-vault.mjs --json --explica "$PAGINA" > "$DIR/plafon-inainte.json" || true
          echo "octeti=$(jq -r '.pagini[0].corp.octeti // 0' "$DIR/plafon-inainte.json" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          echo "tinta=$(jq -r '.pagini[0].corp.tinta // 8192' "$DIR/plafon-inainte.json" 2>/dev/null || echo 8192)" >> "$GITHUB_OUTPUT"
          echo "dur=$(jq -r '.pagini[0].corp.dur // 12288' "$DIR/plafon-inainte.json" 2>/dev/null || echo 12288)" >> "$GITHUB_OUTPUT"

      - name: Rescrie pagina
        id: claude
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PAGINA: ${{ matrix.pagina }}
          DIR: ${{ steps.material.outputs.dir }}
          VECHI: ${{ steps.material.outputs.vechi }}
          SUBDIR: ${{ steps.material.outputs.subdir }}
          OCTETI: ${{ steps.material.outputs.octeti }}
          TINTA: ${{ steps.material.outputs.tinta }}
          DUR: ${{ steps.material.outputs.dur }}
        run: |
          set -uo pipefail
          # Promptul se compune dintr-un șablon, nu dintr-un heredoc: terminatorul
          # la coloana 0 rupe blocul `run: |` din YAML, iar unul indentat nu e
          # recunoscut de bash. `prompt.mjs` substituie DOAR variabile numite.
          #
          # `bypassPermissions`, nu `acceptEdits`: orice cale sub `.claude/` e
          # tratată de harness ca fișier sensibil și cere aprobare explicită, care
          # într-o rulare neinteractivă nu poate veni. Prima rulare reală a pierdut
          # patru rescrieri complete exact așa, raportând `success`. Izolarea nu
          # vine de la promptul de permisiune, ci de la job: `contents: read`, fără
          # credențiale git, fără `Bash` — plus poarta structurală din `consolidare`,
          # care abandonează la orice modificare în afara vault-ului.
          export REPO="$GITHUB_REPOSITORY" SHA_VECHI="$VECHI" SHA_NOU="$GITHUB_SHA"
          node scripts/docs/prompt.mjs .github/documentatie-prompt.md "$DIR/prompt.txt"

          # O singură definiție a invocării, pentru ambele treceri: aceleași
          # unelte, aceleași interdicții.
          agent() {
            claude -p "$(cat "$1")" \
              --model claude-opus-5 \
              --effort high \
              --allowedTools "Read,Grep,Glob,Write,Edit" \
              --disallowedTools "Bash,Task,WebFetch,WebSearch" \
              --add-dir "$DIR" \
              --max-turns 40 \
              --mcp-config '{"mcpServers":{}}' \
              --strict-mcp-config \
              --permission-mode bypassPermissions \
              --output-format json \
              > "$DIR/sesiune$2.json" 2> "$DIR/stderr$2.log"
          }
          avertizeaza() {
            tip=$(jq -r '.subtype // "fără subtype"' "$DIR/sesiune$2.json" 2>/dev/null || echo "fără JSON")
            echo "::warning title=Agentul a picat::$3 — cod $1, $tip — $(tail -c 800 "$DIR/stderr$2.log" | tr '\n' ' ')"
          }

          # `|| cod=$?`, nu `cod=$?` pe linia următoare: pasul rulează sub
          # `bash -e`, deci un `claude` care iese cu non-zero oprea pasul ÎNAINTE
          # de avertisment — 16–21 oct, jobul arăta doar „exit code 1", fără motiv.
          cod=0
          agent "$DIR/prompt.txt" "" || cod=$?
          jq -r '.is_error // false' "$DIR/sesiune.json" 2>/dev/null || true
          if [ "$cod" != "0" ]; then avertizeaza "$cod" "" "rescrierea"; fi

          # A doua trecere: SPARGEREA. Până pe 23 oct, o pagină împinsă peste
          # plafonul dur căpăta eroarea `R`, comparația o revertea, iar a doua zi
          # diff-ul de recitit era și mai mare — se revertea în fiecare noapte și
          # nu se mai actualiza niciodată. Iar una trecută DEJA de plafon nu mai
          # era revertită (1 → 1 erori) și creștea nestingherită. Plafonul îl
          # MĂSOARĂ lintul, după rescriere; agentul doar mută secțiuni în
          # subpagini noi, sub `$SUBDIR/`, după `.claude/docs/meta/conventii.md`.
          node scripts/docs/lint-vault.mjs --json --explica "$PAGINA" > "$DIR/plafon-dupa.json" || true
          octeti=$(jq -r '.pagini[0].corp.octeti // 0' "$DIR/plafon-dupa.json" 2>/dev/null || echo 0)
          if [ "$octeti" -gt "$DUR" ]; then
            echo "::notice title=Peste plafon::$PAGINA are $octeti octeți (plafonul dur e $DUR) — a doua trecere o sparge"
            OCTETI="$octeti" node scripts/docs/prompt.mjs .github/documentatie-sparge-prompt.md "$DIR/prompt-sparge.txt"
            cods=0
            agent "$DIR/prompt-sparge.txt" "-sparge" || cods=$?
            if [ "$cods" != "0" ]; then
              avertizeaza "$cods" "-sparge" "spargerea"
              if [ "$cod" = "0" ]; then cod=$cods; fi
            fi
          fi

          echo "cod=$cod" >> "$GITHUB_OUTPUT"
          # Pasul rămâne roșu când un agent pică (`continue-on-error` lasă jobul
          # să împacheteze ce s-a scris); avertismentul de mai sus spune motivul.
          exit "$cod"

      - name: Împachetează rezultatul
        env:
          PAGINA: ${{ matrix.pagina }}
          DIR: ${{ steps.material.outputs.dir }}
        run: |
          set -uo pipefail
          mkdir -p "$DIR/livrare"
          # Nume PLAT, nu structura de directoare: `.claude` e ascuns, iar
          # `actions/upload-artifact` exclude implicit fișierele ascunse — pagina
          # ar dispărea tăcut din artefact, iar consolidarea ar găsi zero fișiere
          # de aplicat și ar raporta „nimic de publicat". S-a întâmplat.
          cp "$PAGINA" "$DIR/livrare/pagina.md"
          cp "$DIR/rezumat.json" "$DIR/livrare/rezumat.json" 2>/dev/null \
            || echo "{\"pagina\":\"$PAGINA\",\"modificata\":false}" > "$DIR/livrare/rezumat.json"
          find "$DIR" -maxdepth 1 -name '*.propus*' -exec cp {} "$DIR/livrare/" \; 2>/dev/null || true

          # Subpaginile unei spargeri: DOAR fișiere NOI, neurmărite, direct sub
          # `<pagina fără .md>/`, cu nume `[a-z0-9-]+.md`. Lista o face git-ul
          # runner-ului, nu `rezumat.json` (auto-raportarea agentului nu e dovadă).
          # O subpagină care există deja are jobul ei de noapte și nu se rescrie de
          # aici; orice altă schimbare rămâne pe runner, cu un avertisment.
          SUBDIR="${PAGINA%.md}"
          : > "$DIR/livrare/subpagini.tsv"
          i=0
          while IFS= read -r f; do
            nume="${f#"$SUBDIR"/}"
            [ "$nume" != "$f" ] || continue
            if ! printf '%s\n' "$nume" | grep -qE '^[a-z0-9][a-z0-9-]*\.md$'; then continue; fi
            i=$((i + 1))
            cp -- "$f" "$DIR/livrare/sub-$i.md"
            printf 'sub-%s.md\t%s\n' "$i" "$f" >> "$DIR/livrare/subpagini.tsv"
          done < <(git ls-files --others --exclude-standard -- "$SUBDIR/")
          while IFS= read -r linie; do
            cale="${linie:3}"
            [ "$cale" = "$PAGINA" ] && continue
            if cut -f2 "$DIR/livrare/subpagini.tsv" | grep -qxF -- "$cale"; then continue; fi
            echo "::warning title=Schimbare ignorată::$cale nu e pagina primită și nici o subpagină nouă a ei"
          done < <(git status --porcelain --untracked-files=all)
          ls -la "$DIR/livrare"

      - uses: actions/upload-artifact@v4
        with:
          name: pagina-${{ strategy.job-index }}
          path: ${{ steps.material.outputs.dir }}/livrare
          include-hidden-files: true
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Publicarea. FĂRĂ LLM — singurul job cu `contents: write`.
  # ───────────────────────────────────────────────────────────────────────────
  consolidare:
    name: Verifică și publică
    needs: [triaj, pagina]
    if: always() && needs.triaj.outputs.activ == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main # vezi nota de la triaj: `github.sha` e vârful de dinainte de reparare

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.VERSIUNE_NODE }}
          cache: pnpm

      - name: Amprenta lintului ÎNAINTE
        run: node scripts/docs/lint-vault.mjs --json > "$RUNNER_TEMP/lint-inainte.json" || true

      - uses: actions/download-artifact@v4
        if: needs.triaj.outputs.rulam == 'true'
        with:
          path: ${{ runner.temp }}/artefacte
          pattern: pagina-*

      - name: Aplică paginile
        if: needs.triaj.outputs.rulam == 'true'
        run: |
          set -uo pipefail
          aplicate=0
          # O familie pe linie: pagina-mamă și subpaginile NOI ale spargerii ei.
          # Poarta de lint le retrage împreună (`lint-compara.mjs --familii`).
          : > "$RUNNER_TEMP/familii.txt"
          for d in "$RUNNER_TEMP"/artefacte/pagina-*; do
            [ -d "$d" ] || continue
            [ -f "$d/rezumat.json" ] || continue
            tinta=$(jq -r '.pagina // empty' "$d/rezumat.json")
            # `rezumat.json` e scris de agent, deci `tinta` e o cale pe care nu o
            # controlăm. Un prefix `.claude/docs/` NU e suficient: „.claude/docs/
            # ../../../etc/x" îl trece. Se verifică forma ȘI containment-ul real.
            case "$tinta" in
              *..*|/*|"") echo "::error title=Țintă refuzată::$tinta"; exit 1 ;;
              .claude/docs/*.md) ;;
              *) echo "::error title=Țintă refuzată::$tinta"; exit 1 ;;
            esac
            rad=$(realpath .)
            abs=$(realpath -m -- "$tinta")
            case "$abs" in
              "$rad"/.claude/docs/*) ;;
              *) echo "::error title=Ținta iese din vault::$tinta -> $abs"; exit 1 ;;
            esac
            if [ -f "$d/pagina.md" ]; then
              cp "$d/pagina.md" "$tinta"
              echo "  aplicat: $tinta"
              aplicate=$((aplicate + 1))
            fi

            # Subpaginile spargerii. Și aici calea vine din artefact, deci se
            # verifică la fel de strict ca ținta: un singur nivel sub
            # `<tinta fără .md>/`, nume `[a-z0-9-]+.md`, fără `..`, în vault.
            familie="$tinta"
            if [ -f "$d/subpagini.tsv" ]; then
              sub="${tinta%.md}"
              while IFS=$'\t' read -r plat cale; do
                [ -n "$plat" ] || continue
                nume="${cale#"$sub"/}"
                if ! printf '%s\n' "$plat" | grep -qE '^sub-[0-9]+\.md$' \
                  || [ "$nume" = "$cale" ] \
                  || ! printf '%s\n' "$nume" | grep -qE '^[a-z0-9][a-z0-9-]*\.md$'; then
                  echo "::error title=Subpagină refuzată::$cale (din $plat) nu e o subpagină nouă a lui $tinta"
                  exit 1
                fi
                case "$(realpath -m -- "$cale")" in
                  "$rad"/.claude/docs/*) ;;
                  *) echo "::error title=Subpagină refuzată::$cale iese din vault"; exit 1 ;;
                esac
                if [ -e "$cale" ]; then
                  echo "::warning title=Subpagină existentă::$cale e deja în arbore — are jobul ei, spargerea n-o suprascrie"
                  continue
                fi
                mkdir -p -- "$sub"
                cp -- "$d/$plat" "$cale"
                echo "  aplicat: $cale (subpagină nouă a lui $tinta)"
                familie="$familie $cale"
                aplicate=$((aplicate + 1))
              done < "$d/subpagini.tsv"
            fi
            echo "$familie" >> "$RUNNER_TEMP/familii.txt"
          done
          echo "aplicate=$aplicate" >> "$GITHUB_ENV"
          echo "Pagini aplicate: $aplicate"

      - name: Agenții au putut chiar să scrie?
        if: needs.triaj.outputs.rulam == 'true'
        # Prima rulare reală a raportat `success` cu zero pagini schimbate, deși
        # toți patru agenții pregătiseră rescrieri complete și fuseseră refuzați la
        # scriere. „Nicio schimbare" e un rezultat valid DOAR dacă agentul a decis
        # asta; dacă a fost împiedicat, e o eroare care trebuie să se vadă.
        run: |
          set -uo pipefail
          blocate=0
          for r in "$RUNNER_TEMP"/artefacte/pagina-*/rezumat.json; do
            [ -f "$r" ] || continue
            pag=$(jq -r '.pagina // "?"' "$r")
            if jq -e 'has("blocaj") or has("blocat")' "$r" >/dev/null 2>&1; then
              echo "::error title=Agent blocat::$pag — $(jq -r '.descriere // ""' "$r" | head -c 300)"
              blocate=$((blocate + 1))
            fi
            if [ -f "$(dirname "$r")/$(basename "$pag" .md).md.propus" ]; then
              echo "::warning title=Propunere nescrisă::$pag are o propunere în artefact"
            fi
          done
          pretinse=0
          for r in "$RUNNER_TEMP"/artefacte/pagina-*/rezumat.json; do
            [ -f "$r" ] || continue
            if [ "$(jq -r '.modificata // false' "$r")" = "true" ]; then
              pretinse=$((pretinse + 1))
            fi
          done
          # Un agent care raportează „am modificat" dar a cărui pagină nu ajunge pe
          # disc înseamnă că s-a pierdut ceva între job-uri — nu că n-a fost nevoie.
          if [ "$pretinse" -gt 0 ] && [ "${aplicate:-0}" = "0" ]; then
            echo "::error title=Pagini pierdute::$pretinse agenți raportează modificări, dar zero pagini au ajuns în arbore"
            exit 1
          fi
          if [ "$blocate" -gt 0 ]; then
            echo "::error title=Sincronizare eșuată::$blocate agenți n-au putut scrie pagina"
            exit 1
          fi
          echo "Niciun agent blocat."

      - name: Prettier peste vault
        # `.prettierignore` nu conține `.claude`, iar `format:check` din jobul
        # `quality` chiar acoperă markdown-ul de acolo. Fără pasul ăsta, main ar fi
        # roșu în fiecare dimineață pe fișiere pe care omul nu le-a scris.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --write ".claude/docs/**/*.md" || true

      - name: Poarta structurală
        # Rulează ÎNAINTE de a verifica dacă vault-ul s-a schimbat: altfel cazul
        # „agentul a scris NUMAI în afara vault-ului" ar ocoli poarta.
        run: |
          set -uo pipefail
          afara=$(git status --porcelain | grep -v '^.. \.claude/docs/' || true)
          if [ -n "$afara" ]; then
            echo "::error title=Modificări în afara vault-ului::$afara"
            git diff > "$RUNNER_TEMP/neasteptat.patch"
            exit 1
          fi
          delta=$(git diff --numstat -- .claude/docs | awk '{s+=$1+$2} END {print s+0}')
          echo "delta=$delta linii"
          if [ "$delta" -gt 1500 ]; then
            echo "::error title=Rescriere en-gros::$delta linii — semnătura unei rescrieri, nu a unei actualizări"
            exit 1
          fi

      - name: Lint după, comparat independent
        # Poarta nu e „zero erori", e „nicio eroare în plus". Comparația o face
        # workflow-ul, nu Claude — același protocol ca la `revizuire.yml`.
        run: |
          set -uo pipefail
          node scripts/docs/lint-vault.mjs --json > "$RUNNER_TEMP/lint-dupa.json" || true
          node scripts/docs/lint-compara.mjs "$RUNNER_TEMP/lint-inainte.json" "$RUNNER_TEMP/lint-dupa.json" \
            --familii "$RUNNER_TEMP/familii.txt" \
            | tee "$RUNNER_TEMP/compara.txt" | tee -a "$GITHUB_STEP_SUMMARY"

          # Comparația nu doar raportează: paginile care au CĂPĂTAT erori se
          # revertesc individual, restul se publică. O poartă care doar scrie în
          # rezumat lasă erorile să ajungă pe main — s-a întâmplat la prima
          # publicare reală, iar `vault.yml` a devenit roșu pentru toată lumea.
          #
          # O spargere se retrage ÎNTREAGĂ (mama și subpaginile ei noi; lista o
          # dă `--familii`). Subpagina nouă e neurmărită: `git checkout HEAD`
          # pică pe ea, deci se șterge — altfel rămânea în arbore, verificarea
          # de mai jos o găsea tot stricată și se anula toată noaptea.
          revert=$(sed -n 's/^REVERT: //p' "$RUNNER_TEMP/compara.txt")
          if [ -n "$revert" ]; then
            for pag in $revert; do
              case "$pag" in
                *..*) echo "::error title=Cale de revert refuzată::$pag"; exit 1 ;;
                .claude/docs/*.md) ;;
                *) echo "::error title=Cale de revert refuzată::$pag"; exit 1 ;;
              esac
              if git ls-files --error-unmatch -- "$pag" >/dev/null 2>&1; then
                git checkout HEAD -- "$pag"
                echo "::warning title=Pagină revertită::$pag a căpătat erori noi (singură sau prin familia ei)"
              else
                rm -f -- "$pag"
                echo "::warning title=Subpagină nouă retrasă::$pag — spargerea din care face parte a căpătat erori noi"
              fi
            done
            # Verificarea de după revert e RELATIVĂ, ca tot restul porții. Aici a
            # stat un `lint-vault.mjs` absolut, care contrazicea exact regula
            # scrisă de două ori mai sus: cerea „zero erori în tot vault-ul", nu
            # „nicio eroare în plus". Trei nopți la rând (31.08, 01.09, 02.09)
            # agenții au rescris corect cinci pagini, revertul a prins cele două
            # regresii reale, iar publicarea a fost anulată pentru erori
            # PREEXISTENTE pe pagini pe care noaptea aia nici nu le atinsese —
            # `flota.md` avea deja una (a mers 1 → 2), `concedii.md` era deja
            # peste plafon. Munca bună a fost aruncată din cauza unei roșeți pe
            # care nocturna n-o produsese și n-o putea repara.
            node scripts/docs/lint-vault.mjs --json > "$RUNNER_TEMP/lint-final.json" || true
            node scripts/docs/lint-compara.mjs \
              "$RUNNER_TEMP/lint-inainte.json" "$RUNNER_TEMP/lint-final.json" \
              --familii "$RUNNER_TEMP/familii.txt" \
              > "$RUNNER_TEMP/final.txt"
            if grep -q '^REVERT: ' "$RUNNER_TEMP/final.txt"; then
              echo "::error title=Revertul n-a curățat regresiile::nu public"
              cat "$RUNNER_TEMP/final.txt"
              exit 1
            fi
          fi

          # Erorile preexistente nu mai blochează publicarea, dar nu au voie nici
          # să treacă tăcut: tăcerea le-ar transforma în datorie permanentă.
          if ! node scripts/docs/lint-vault.mjs > "$RUNNER_TEMP/absolut.txt" 2>&1; then
            echo "::warning title=Vault-ul are erori preexistente::publicarea continuă; erorile de mai jos existau ÎNAINTE de noaptea asta"
            cat "$RUNNER_TEMP/absolut.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comite și publică
        if: ${{ inputs.uscat != true }}
        # Pasul e acoperit de `scripts/docs/publicare.test.ts`, care îl extrage de
        # aici și îl rulează ca pe runner, pe un remote bare local.
        run: |
          set -uo pipefail
          # GitHub rulează pasul cu `bash -e {0}`, iar `set -uo pipefail` NU anulează
          # `-e`: orice comandă care pică oprește pasul. Șase nopți (16–21 oct 2026)
          # s-a oprit așa fără niciun rând în jurnal, cu „exit code 1" și atât.
          # Capcana de mai jos lasă măcar linia și comanda.
          trap 'c=$?; echo "::error title=Pasul s-a oprit::linia $LINENO, cod $c: $BASH_COMMAND"' ERR
          git config user.name "claude-documentatie[bot]"
          git config user.email "claude-documentatie[bot]@users.noreply.github.com"

          azi=$(date -u +%Y-%m-%d)

          # `scris_pe` se avansează MECANIC, doar pentru paginile care apar efectiv
          # în diff — niciodată din auto-raportarea agentului. Plus subpaginile
          # NOI ale unei spargeri: `git diff` nu vede fișierele neurmărite, iar
          # ele ar fi ajuns pe main cu SHA-ul vechi copiat din mamă.
          atinse=""
          for p in $(git diff --name-only -- .claude/docs; git ls-files --others --exclude-standard -- .claude/docs); do
            case "$p" in .claude/docs/meta/log.md) continue ;; esac
            sed -i "s/^scris_pe: .*/scris_pe: ${GITHUB_SHA}/" "$p"
            sed -i "s/^scris_la: .*/scris_la: ${azi}/" "$p"
            atinse="$atinse ${p#.claude/docs/}"
          done

          # Jurnalul zilei se scrie ÎNTOTDEAUNA, chiar și când nicio pagină n-a
          # avut nevoie de schimbare. E bătaia de inimă a rutinei: fără ea, „a
          # rulat și n-a fost nevoie de nimic" arată identic cu „n-a rulat deloc" —
          # exact ambiguitatea care a ținut `revizuire.yml` verde o săptămână fără
          # să pornească.
          #
          # Se consemnează CĂI și cifre, nu mesaje de commit: mesajele sunt text
          # scris de oricine face un push, iar aici ajung într-un fișier versionat.
          nrc=$(git log --since="24 hours ago" --oneline | wc -l | tr -d ' ')
          # Module atinse, nu prefixe de cale: `.env.example` și `CLAUDE.md` nu
          # spun nimic într-un jurnal de documentație, iar `src/app` spune și mai
          # puțin. Ce contează e CE modul s-a mișcat și dacă s-a mișcat schema.
          #
          # `sed '/^$/d'`, NU `grep -v '^$'`: într-o noapte fără niciun commit pe
          # main în ultimele 24 de ore, `grep` primea intrare goală și ieșea cu 1,
          # `pipefail` îl propaga, iar `-e` oprea pasul AICI, înainte de commit —
          # 16–21 oct 2026, după ce ultimul commit (al nocturnei din 15) a trecut de
          # 24 de ore. Cum nu se mai comitea nimic, a doua zi main era iar inactiv:
          # eșecul se întreținea singur. Mesajul „main s-a mișcat de trei ori" din
          # jurnal era doar listarea scriptului; bucla de push nici nu pornise.
          fisiere=$(git log --since="24 hours ago" --name-only --format= | sed '/^$/d' | sort -u)
          zone=$(echo "$fisiere" | sed -n 's|^src/app/(app)/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')
          straturi=""
          echo "$fisiere" | grep -q '^supabase/migrations/' && straturi="$straturi migrări"
          echo "$fisiere" | grep -q '^src/lib/queries/'    && straturi="$straturi citiri"
          echo "$fisiere" | grep -q '^src/schemas/'        && straturi="$straturi scheme"
          echo "$fisiere" | grep -q '^src/domain/'         && straturi="$straturi domeniu"
          echo "$fisiere" | grep -q '^src/config/'         && straturi="$straturi configurație"
          # O linie de jurnal nu are voie să oprească publicarea paginilor.
          fara=$(ZILE_ACOPERIRE=1 node scripts/docs/acoperire.mjs --json \
            | jq -r '.fierbintiFaraPagina | join(", ")') || {
            echo "::warning title=Acoperire indisponibilă::jurnalul iese fără linia paginilor lipsă"
            fara=""
          }
          {
            echo ""
            echo "## ${azi}"
            echo ""
            echo "- commit-uri în ultimele 24h: ${nrc}"
            echo "- module atinse: ${zone:-—}"
            echo "- straturi atinse:${straturi:- —}"
            if [ -n "$atinse" ]; then
              echo "- pagini rescrise:${atinse}"
            else
              echo "- pagini rescrise: niciuna (agenții au citit diff-ul și n-au găsit contract schimbat)"
            fi
            if [ -n "$fara" ]; then
              echo "- atinse azi, dar FĂRĂ pagină: ${fara}"
            fi
          } >> .claude/docs/meta/log.md
          pnpm exec prettier --write ".claude/docs/**/*.md" || true

          git add -- .claude/docs
          pagini=$(git diff --cached --name-only -- .claude/docs | tr '\n' ' ')

          # Mesajul se construiește într-un FIȘIER, cu toate liniile indentate. Un
          # `-m` multi-linie pune liniile următoare la coloana 0, ceea ce închide
          # blocul `run: |` și le transformă în chei YAML de nivel înalt. GitHub
          # respinge fișierul; `yaml.safe_load` îl acceptă tăcut. De asta există
          # `scripts/docs/verifica-workflow.mjs`.
          {
            if [ -n "$atinse" ]; then
              echo "docs(vault): sincronizare automată [documentatie automata] [skip ci]"
            else
              echo "docs(vault): jurnalul zilei, fără schimbări de pagină [documentatie automata] [skip ci]"
            fi
            echo
            echo "Pagini atinse: $pagini"
            echo
            echo "Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>"
          } > "$RUNNER_TEMP/mesaj.txt"
          git commit --only -F "$RUNNER_TEMP/mesaj.txt" -- .claude/docs

          # Fără `--quiet`, iar ieșirea push-ului se păstrează: eșecul își spune
          # motivul în jurnal și în adnotare. Se reia DOAR când motivul chiar e
          # „main s-a mișcat" (sau o cădere de rețea); un refuz al remote-ului —
          # protecție, hook, token fără drept — nu se repară reluând, iar mesajul
          # vechi îl raporta drept „main s-a mișcat de trei ori".
          motiv="nicio încercare n-a ajuns la push"
          for i in 1 2 3; do
            [ "$i" = "1" ] || sleep $((i * 5))
            if ! git fetch origin main; then
              motiv="git fetch a eșuat"
              echo "::warning title=Fetch eșuat::încercarea $i"
              continue
            fi
            if ! git merge origin/main --no-edit; then
              motiv="conflict de merge cu origin/main"
              echo "::warning title=Conflict::încercarea $i — merge anulat"
              git merge --abort || true
              continue
            fi
            if git push origin HEAD:main 2>&1 | tee "$RUNNER_TEMP/push.log"; then
              echo "::notice::Publicat."
              exit 0
            fi
            motiv=$(grep -E '^ ! |^(error|fatal|remote): ' "$RUNNER_TEMP/push.log" \
              | sed 's/[[:space:]]*$//' | head -4 | tr '\n' ' ' || true)
            motiv=${motiv:-push eșuat fără mesaj}
            if grep -qE '\[rejected\].*\((fetch first|non-fast-forward)\)' "$RUNNER_TEMP/push.log"; then
              echo "::warning title=main s-a mișcat::încercarea $i — reiau fetch + merge"
            elif grep -qiE 'RPC failed|returned error: 5[0-9][0-9]|Could not resolve host|Connection (timed out|reset)|early EOF' "$RUNNER_TEMP/push.log"; then
              echo "::warning title=Push căzut în rețea::încercarea $i"
            else
              echo "::error title=Push refuzat::$motiv"
              exit 1
            fi
          done
          echo "::error title=Publicare eșuată::trei încercări; ultimul motiv: $motiv"
          exit 1
