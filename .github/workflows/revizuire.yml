name: Revizuire

# ─────────────────────────────────────────────────────────────────────────────
# Revizuire multi-agent NOCTURNĂ, pe toate commit-urile de la ultima rulare.
# Fără PR, fără merge. Un raport pe zi, pe WhatsApp, nu unul pe fiecare push.
#
# Ziua se taie în bucăți care încap sub pragul de triaj și se revizuiesc
# secvențial — vezi pasul „Calculează intervalele de diff”. Fără tăiere, o zi
# obișnuită depășește pragul și revizuirea s-ar sări în tăcere.
#
# DE CE NU `anthropics/claude-code-action`: acțiunea acceptă `schedule`, deci
# restricția de eveniment nu ne-ar mai încurca azi — dar rămânem pe CLI pentru
# motivul de mai jos, care e despre credențialul git, nu despre eveniment.
# (Istoric: pe vremea declanșatorului `push`, acțiunea nici nu putea fi
# folosită — `src/github/context.ts` respinge `push` printr-o listă albă în cod.)
#
# BONUS al rulării directe: acțiunea își înlocuiește propriul credențial git
# peste cel pus de actions/checkout, cu un token de GitHub App — iar push-urile
# cu token de App RE-DECLANȘEAZĂ workflow-urile. CLI-ul nu atinge credențialul,
# deci push-ul din jobul de reparare rămâne pe GITHUB_TOKEN, care prin
# construcție nu re-declanșează nimic. Bucla e ruptă la sursă.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # NOCTURNĂ, nu la push. Un raport pe zi, pe toate commit-urile ultimelor 24 h,
  # în loc de câte unul pe fiecare push — la 20 de push-uri pe zi, notificarea
  # devenea zgomot și nimeni nu mai citea niciunul.
  #
  # Minut impar, DELIBERAT, din aceeași lecție ca la `documentatie.yml`: GitHub
  # întârzie rulările programate în orele aglomerate, iar ora rotundă e cel mai
  # aglomerat slot care există. În practică, aici, cronul de 02:37 pornește
  # între 07:20 și 08:50 UTC — deci raportul ajunge dimineața, ceea ce e exact
  # ce vrem, dar nu conta pe minutul scris mai jos.
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      interval:
        description: "Interval de commit-uri (ex. HEAD~3..HEAD). Gol = ultimele 24 h."
        required: false
        default: ""
      repara:
        description: "Repară automat findings-urile critical/high"
        type: boolean
        default: false

concurrency:
  # Grup pe SHA. Cu `cancel-in-progress: false`, o rulare manuală pornită peste
  # cea nocturnă se așază la coadă în loc să o omoare — iar noaptea revizuită
  # n-ar mai fi reacoperită niciodată de altcineva, fiindcă nu mai există o
  # rulare per push care să prindă din urmă.
  group: revizuire-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  VERSIUNE_CLAUDE: "2.1.238"
  VERSIUNE_NODE: "22"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. TRIAJ — ieftin, decide dacă merită să pornim Opus.
  # ───────────────────────────────────────────────────────────────────────────
  triaj:
    name: Triaj — merită revizuit?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    # Aici stăteau patru bariere împotriva buclelor — toate citeau
    # `github.event.commits.*` și `github.event.head_commit`, câmpuri care există
    # DOAR pe evenimentul `push`. Pe `schedule` sunt null, iar `join(null, ' ')`
    # întoarce șir gol: barierele s-ar fi evaluat mereu la „treci", adică ar fi
    # fost teatru. Le-am scos, fiindcă bucla pe care o păzeau nu mai poate exista:
    # singurul lucru care declanșa workflow-ul după push-ul jobului de reparare
    # era chiar declanșatorul `push`, iar acela nu mai e.
    outputs:
      rulam: ${{ steps.decizie.outputs.rulam }}
      intervale: ${{ steps.decizie.outputs.intervale }}
      bucati: ${{ steps.decizie.outputs.bucati }}
      motiv: ${{ steps.decizie.outputs.motiv }}
      bariere_sql: ${{ steps.ci.outputs.bariere_sql }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculează intervalele de diff
        id: interval
        env:
          AFTER: ${{ github.sha }}
          MANUAL: ${{ inputs.interval }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # Pragurile per BUCATĂ. Sunt aceleași cu cele pe care analiza le avea
          # când rula per push, și rămân aceleași DELIBERAT: mutarea pe nocturn
          # schimbă CÂND rulează revizuirea, nu cât de mare e diff-ul pe care îl
          # citește un revizor. O zi întreagă într-o singură bucată ar fi fost
          # 249 de fișiere și 15.726 de linii (3 septembrie, măsurat) — de două
          # ori peste ce a fost calibrată analiza să ducă.
          MAX_FISIERE=120
          MAX_LINII=6000
          MAX_BUCATI=8

          FILTRE=( 'src/**' 'supabase/migrations/**' 'tests/**' 'scripts/**'
                   '*.ts' '*.tsx' '*.mjs' '*.mts' '*.json' )

          masoara() { # $1=bază $2=vârf → „nrFișiere nrLinii”
            local f n
            f=$(git diff --name-only --diff-filter=ACMR "$1" "$2" -- "${FILTRE[@]}" 2>/dev/null \
                | grep -cv '^src/types/database.ts$' || true)
            n=$(git diff --numstat "$1" "$2" -- "${FILTRE[@]}" 2>/dev/null \
                | grep -v 'src/types/database\.ts$' \
                | awk '{a+=$1; d+=$2} END {print (a+d)+0}')
            echo "${f:-0} ${n:-0}"
          }

          # Rulare manuală cu interval explicit — are prioritate, o singură bucată.
          if [ -n "${MANUAL:-}" ]; then
            printf 'intervale=%s\n' "$(jq -cn --arg i "$MANUAL" '[$i]')" >> "$GITHUB_OUTPUT"
            { echo "valid=true"; echo "bucati=1"; } >> "$GITHUB_OUTPUT"
            echo "Interval manual: ${MANUAL}"
            exit 0
          fi

          # ── De unde reluăm ────────────────────────────────────────────────
          # NU „acum minus 24 de ore”. GitHub chiar pierde rulări programate în
          # orele aglomerate — `documentatie.yml` are asta scrisă în antet, de la
          # o nocturnă care n-a pornit niciodată. Cu o fereastră fixă de 24 h, o
          # noapte pierdută ar lăsa o zi de cod nerevizuită PENTRU TOTDEAUNA,
          # fiindcă nu mai există revizuire per push care să prindă din urmă.
          # Ancora e vârful ultimei rulări nocturne, oricât de veche ar fi.
          baza=""
          ultima=$(gh run list --workflow=revizuire.yml --event=schedule \
                     --status=completed --limit=1 --json headSha \
                     --jq '.[0].headSha // ""' 2>/dev/null || echo "")
          if [ -n "$ultima" ] && git cat-file -e "${ultima}^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "$ultima" "$AFTER" 2>/dev/null \
             && [ "$ultima" != "$AFTER" ]; then
            baza="$ultima"
            echo "Ancoră: vârful ultimei nocturne ($ultima)."
          else
            baza=$(git rev-list -1 --before="24 hours ago" "$AFTER" 2>/dev/null || echo "")
            echo "Fără ancoră utilizabilă — cad pe fereastra de 24 de ore."
          fi

          if [ -z "$baza" ] || [ "$baza" = "$AFTER" ]; then
            { echo "intervale=[]"; echo "valid=false"; echo "bucati=0"; } >> "$GITHUB_OUTPUT"
            echo "::notice title=Nimic de revizuit::Niciun commit nou de la ultima rulare."
            exit 0
          fi

          mapfile -t comite < <(git rev-list --reverse "${baza}..${AFTER}")
          echo "Commit-uri de acoperit: ${#comite[@]} (${baza:0:8}..${AFTER:0:8})"

          # ── Împărțirea în bucăți ──────────────────────────────────────────
          # Se taie ÎNAINTE de commit-ul care ar duce bucata peste prag, nu după:
          # altfel prima bucată ar putea ieși oricât de mare. Un singur commit
          # care sare singur peste prag rămâne bucata lui, prea mare — se
          # raportează, nu se aruncă.
          bucati=(); start="$baza"; ultim_bun=""
          for c in "${comite[@]}"; do
            read -r nf nl <<< "$(masoara "$start" "$c")"
            if { [ "$nf" -gt "$MAX_FISIERE" ] || [ "$nl" -gt "$MAX_LINII" ]; } \
               && [ -n "$ultim_bun" ]; then
              bucati+=("${start}..${ultim_bun}")
              start="$ultim_bun"
              ultim_bun="$c"
            else
              ultim_bun="$c"
            fi
          done
          [ -n "$ultim_bun" ] && bucati+=("${start}..${ultim_bun}")

          # Prea multe bucăți ⇒ NU tăiem din acoperire, lărgim bucățile. A revizui
          # doar ultimele N ar însemna cod nerevizuit fără ca nimeni să afle —
          # exact felul de plafon tăcut din care se nasc defectele care „au trecut
          # de revizuire”.
          if [ "${#bucati[@]}" -gt "$MAX_BUCATI" ]; then
            echo "::warning title=Zi foarte mare::${#bucati[@]} bucăți naturale, peste plafonul de ${MAX_BUCATI}; le comasez în ${MAX_BUCATI} bucăți mai mari. Fiecare revizor va citi un diff peste dimensiunea calibrată."
            total=${#comite[@]}
            pas=$(( (total + MAX_BUCATI - 1) / MAX_BUCATI ))
            bucati=(); start="$baza"
            for (( i=pas-1; i<total; i+=pas )); do
              bucati+=("${start}..${comite[$i]}")
              start="${comite[$i]}"
            done
            [ "$start" != "$AFTER" ] && bucati+=("${start}..${AFTER}")
          fi

          # Bucățile fără niciun fișier relevant (doar markdown, ops, public…) se
          # scot aici: altfel ar porni Opus ca să constate că n-are ce citi.
          pastrate=()
          for b in "${bucati[@]}"; do
            read -r nf nl <<< "$(masoara "${b%%..*}" "${b##*..}")"
            if [ "$nf" -gt 0 ]; then
              pastrate+=("$b")
              printf '  bucată: %s..%s · %s fișiere · %s linii\n' \
                "${b%%..*}" "${b##*..}" "$nf" "$nl" | sed 's/\([0-9a-f]\{8\}\)[0-9a-f]*/\1/g'
            fi
          done

          if [ "${#pastrate[@]}" -eq 0 ]; then
            { echo "intervale=[]"; echo "valid=false"; echo "bucati=0"; } >> "$GITHUB_OUTPUT"
            echo "::notice title=Revizuire sărită::Niciun fișier relevant în ultimele commit-uri."
            exit 0
          fi

          printf 'intervale=%s\n' \
            "$(printf '%s\n' "${pastrate[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            >> "$GITHUB_OUTPUT"
          { echo "valid=true"; echo "bucati=${#pastrate[@]}"; } >> "$GITHUB_OUTPUT"
          echo "Se revizuiesc ${#pastrate[@]} bucăți."

      - name: Barierele SQL din CI rulează?
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Dacă jobul `migrations` din ci.yml e roșu, cele trei bariere SQL și
          # testul de izolare între tenanți NU s-au executat — iar revizorul de
          # bază de date trebuie să le acopere manual.
          concluzie=$(gh run list --workflow=ci.yml --branch=main --limit=1 \
                        --json conclusion --jq '.[0].conclusion // "necunoscut"' 2>/dev/null || echo "necunoscut")
          if [ "$concluzie" = "success" ]; then
            echo "bariere_sql=da" >> "$GITHUB_OUTPUT"
          else
            echo "bariere_sql=nu" >> "$GITHUB_OUTPUT"
          fi
          echo "Ultima rulare CI: $concluzie → bariere SQL active: $([ "$concluzie" = success ] && echo da || echo nu)"

      - name: Decide
        id: decizie
        env:
          INTERVALE: ${{ steps.interval.outputs.intervale }}
          BUCATI: ${{ steps.interval.outputs.bucati }}
          VALID: ${{ steps.interval.outputs.valid }}
          # Doar prezența, niciodată valoarea — expresia se evaluează la
          # "true"/"false", secretul nu ajunge în mediu.
          ARE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -uo pipefail

          # Măsurarea și împărțirea s-au făcut în pasul de mai sus, care le are
          # oricum pe toate în mână. Aici a mai rămas doar decizia.
          printf 'intervale=%s\n' "${INTERVALE:-[]}" >> "$GITHUB_OUTPUT"

          # Fără token, `analiza` ar porni și ar pica la primul apel de CLI.
          # Mai bine trece în gol, cu motivul scris explicit.
          if [ "$ARE_TOKEN" != "true" ]; then
            { echo "rulam=false"
              echo "motiv=CLAUDE_CODE_OAUTH_TOKEN nu e configurat în secretele repo-ului"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Revizuirea e sărită: adaugă secretul CLAUDE_CODE_OAUTH_TOKEN (gh secret set CLAUDE_CODE_OAUTH_TOKEN) ca să o activezi."
            exit 0
          fi

          if [ "$VALID" != "true" ] || [ "${BUCATI:-0}" -eq 0 ]; then
            { echo "rulam=false"; echo "motiv=nimic de revizuit"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          { echo "rulam=true"; echo "motiv=${BUCATI} bucăți"; } >> "$GITHUB_OUTPUT"
          echo "Se revizuiesc ${BUCATI} bucăți."

  # ───────────────────────────────────────────────────────────────────────────
  # 2. ANALIZA — Opus orchestrează 5 revizori Sonnet + verificare adversarială.
  # ───────────────────────────────────────────────────────────────────────────
  analiza:
    name: Analiză multi-agent
    needs: triaj
    if: needs.triaj.outputs.rulam == 'true'
    runs-on: ubuntu-latest
    # Bucățile se revizuiesc SECVENȚIAL, în același job, nu într-o matrice.
    # Matricea ar fi fost mai rapidă, dar ar fi împrăștiat findings-urile în N
    # artefacte și ar fi cerut un job de agregare — iar tot ce vine după analiză
    # (comentariul, issue-ul, WhatsApp-ul, repararea) citește AZI un singur
    # `findings.json` de la o cale fixă. Secvențial, acele patru consumatoare
    # rămân neatinse. Noaptea nu se grăbește nimeni: 8 bucăți × ~18 min încap
    # confortabil, iar plafonul GitHub pentru un job e de 6 ore.
    timeout-minutes: 170
    permissions:
      contents: write # comentariul pe commit trăiește sub scope-ul Contents
      issues: write
    outputs:
      critice: ${{ steps.numara.outputs.critice }}
      majore: ${{ steps.numara.outputs.majore }}
      total: ${{ steps.numara.outputs.total }}
      are_de_reparat: ${{ steps.numara.outputs.are_de_reparat }}
      valida: ${{ steps.numara.outputs.valida }}
    steps:
      # `runner.temp` NU e disponibil în `env:` la nivel de job — contextul
      # `runner` există doar la nivel de pas. Variabila de mediu `$RUNNER_TEMP`
      # e însă mereu în shell, deci o propagăm prin $GITHUB_ENV către pașii
      # următori. Un `env:` de job cu ${{ runner.temp }} face workflow-ul
      # invalid și GitHub îl respinge înainte să pornească vreun job.
      - name: Pregătește directorul de raport
        run: echo "DIR_RAPORT=$RUNNER_TEMP/revizuire" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalează Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$VERSIUNE_CLAUDE"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Analiză
        id: claude
        continue-on-error: true # pasul de numărare trebuie să ruleze oricum
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          INTERVALE: ${{ needs.triaj.outputs.intervale }}
          BARIERE_SQL: ${{ needs.triaj.outputs.bariere_sql }}
        run: |
          set -uo pipefail
          mkdir -p "$DIR_RAPORT"

          mapfile -t bucati < <(printf '%s' "$INTERVALE" | jq -r '.[]')
          echo "Bucăți de revizuit: ${#bucati[@]}"

          esuate=0
          for i in "${!bucati[@]}"; do
            interval="${bucati[$i]}"
            n=$((i + 1))
            dir="$DIR_RAPORT/bucata-$n"
            mkdir -p "$dir"
            echo "::group::Bucata $n/${#bucati[@]} — ${interval}"

            # Promptul interpolează DOAR valori controlate de noi (SHA-uri, nume
            # de repo). Mesajele de commit nu ajung niciodată în prompt — ar fi o
            # cale de injecție într-un repo public.
            PROMPT=$(cat <<PROMPT_EOF
          Repo: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          INTERVAL: ${interval}
          RAPORT_DIR: ${dir}
          BARIERELE_SQL_RULEAZA: ${BARIERE_SQL}

          Invocă skill-ul \`revizuire-erp\` din .claude/skills/ și urmează-l exact.

          Scrie rezultatele în ${dir}/raport.md și ${dir}/findings.json.
          Nu modifica niciun fișier din arborele repo-ului. Nu comite, nu da push.
          PROMPT_EOF
            )

            # `timeout` per bucată, nu `timeout-minutes` pe pas: pasul acoperă
            # acum toate bucățile, deci un plafon de pas ar lăsa o singură bucată
            # blocată să mănânce bugetul tuturor celorlalte. Așa, o bucată moartă
            # costă 28 de minute și restul zilei se revizuiește oricum.
            #
            # --strict-mcp-config cu o configurație goală ignoră .mcp.json din
            # repo: MCP-ul Supabase de acolo cere autentificare interactivă, care
            # în CI ar bloca rularea.
            timeout 28m claude -p "$PROMPT" \
              --model claude-opus-5 \
              --effort xhigh \
              --allowedTools "Read,Grep,Glob,Task,Write,Bash" \
              --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(git config:*),Bash(gh:*)" \
              --add-dir "$dir" \
              --max-turns 75 \
              --mcp-config '{"mcpServers":{}}' \
              --strict-mcp-config \
              --permission-mode acceptEdits \
              --output-format json \
              > "$dir/sesiune.json" 2> "$dir/stderr.log"
            cod=$?
            echo "claude exit: $cod"
            tail -20 "$dir/stderr.log" || true
            if [ ! -s "$dir/findings.json" ]; then
              esuate=$((esuate + 1))
              echo "::warning title=Bucata $n fără raport::${interval} — analiza n-a produs findings.json (exit $cod)."
            fi
            echo "::endgroup::"
          done

          # ── Unirea ────────────────────────────────────────────────────────
          # Tot ce vine după acest pas — comentariul pe commit, issue-ul,
          # WhatsApp-ul și jobul de reparare — citește `$DIR_RAPORT/findings.json`
          # și `raport.md`. Le producem exact acolo, ca niciunul să nu afle că
          # între timp au fost mai multe bucăți.
          mapfile -t fis < <(find "$DIR_RAPORT" -mindepth 2 -name findings.json -size +0c | sort)
          if [ "${#fis[@]}" -gt 0 ]; then
            jq -s '{findings: (map(.findings // []) | add | unique_by([.fisier, .linie, .titlu]))}' \
              "${fis[@]}" > "$DIR_RAPORT/findings.json" 2>/dev/null \
              || echo '{"findings":[]}' > "$DIR_RAPORT/findings.json"
          fi

          : > "$DIR_RAPORT/raport.md"
          for i in "${!bucati[@]}"; do
            n=$((i + 1)); dir="$DIR_RAPORT/bucata-$n"
            {
              printf '\n## Bucata %s/%s — `%s`\n\n' "$n" "${#bucati[@]}" "${bucati[$i]}"
              if [ -s "$dir/raport.md" ]; then cat "$dir/raport.md"
              else printf '_Analiza acestei bucăți nu a produs raport._\n'; fi
            } >> "$DIR_RAPORT/raport.md"
          done

          [ "$esuate" -gt 0 ] && echo "::warning title=Acoperire parțială::$esuate din ${#bucati[@]} bucăți n-au produs raport."
          exit 0

      - name: Numără constatările
        id: numara
        if: always()
        run: |
          set -uo pipefail
          F="$DIR_RAPORT/findings.json"
          critice=0; majore=0; total=0; valida=false

          if [ -s "$F" ] && jq -e 'type=="object" and (.findings|type=="array")' "$F" >/dev/null 2>&1; then
            valida=true
            critice=$(jq '[.findings[]|select((.severitate//""|ascii_downcase)=="critical")]|length' "$F")
            majore=$(jq  '[.findings[]|select((.severitate//""|ascii_downcase)=="high")]|length' "$F")
            total=$(jq '.findings|length' "$F")
          else
            echo "::warning title=Raport lipsă::findings.json absent sau invalid — analiza a eșuat."
          fi

          if [ "$valida" = true ] && [ $((critice + majore)) -gt 0 ]; then are=true; else are=false; fi

          {
            echo "critice=$critice"; echo "majore=$majore"; echo "total=$total"
            echo "are_de_reparat=$are"; echo "valida=$valida"
          } >> "$GITHUB_OUTPUT"
          echo "critice=$critice majore=$majore total=$total valida=$valida"

      - name: Rezumat în pagina rulării
        if: always()
        env:
          # Prin `env:`, nu interpolat direct în shell. Valoarea e construită de
          # noi și conține doar SHA-uri, dar regula casei e ca nimic să nu intre
          # în `run:` prin `${{ }}` — o singură excepție tolerată devine tiparul
          # pe care îl copiază pasul următor.
          INTERVALE: ${{ needs.triaj.outputs.intervale }}
        run: |
          set -uo pipefail
          if [ -s "$DIR_RAPORT/raport.md" ]; then
            cat "$DIR_RAPORT/raport.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ⚠️ Revizuirea nu a produs raport"
              echo
              echo "Bucăți: \`${INTERVALE:-?}\`"
              echo
              echo '```'
              # stderr-ul e acum per bucată; se arată ultima care a scris ceva.
              ultim=$(find "$DIR_RAPORT" -mindepth 2 -name stderr.log -size +0c 2>/dev/null | sort | tail -1)
              if [ -n "$ultim" ]; then tail -40 "$ultim"; else echo "(fără stderr)"; fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pregătește corpul comentariului
        if: steps.numara.outputs.valida == 'true'
        run: |
          set -euo pipefail
          PRAG=60000   # în OCTEȚI. În UTF-8 octeți >= caractere, deci 60k octeți
                       # sunt garantat sub limita GitHub de 65.536 CARACTERE,
                       # fără să numărăm diacriticele (ă î ș ț = 2 octeți).
          octeti=$(wc -c < "$DIR_RAPORT/raport.md")
          if [ "$octeti" -gt "$PRAG" ]; then
            head -c "$PRAG" "$DIR_RAPORT/raport.md" | iconv -c -f UTF-8 -t UTF-8 > "$DIR_RAPORT/corp.md"
            # Închide un eventual bloc de cod tăiat la jumătate, altfel nota de
            # trunchiere ar fi înghițită de el.
            printf '\n```\n\n---\n\n> **Raport trunchiat** (%s din %s octeți). Integral: artefactul `raport-revizuire` din [rularea #%s](%s/%s/actions/runs/%s).\n' \
              "$PRAG" "$octeti" "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
              >> "$DIR_RAPORT/corp.md"
          else
            cp "$DIR_RAPORT/raport.md" "$DIR_RAPORT/corp.md"
          fi

      - name: Comentariu pe commit
        if: steps.numara.outputs.valida == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `jq -Rs` înghite stdin ca un singur string brut și îl escapează
          # corect. `-f body=@fisier` ar posta literal textul "@fisier", iar
          # `-F body=@fisier` ar converti un corp care arată a număr sau a
          # `null` într-un literal JSON.
          jq -Rs '{body: .}' "$DIR_RAPORT/corp.md" \
            | gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
                --method POST --input - --jq '.html_url'

      - name: Issue pentru critical/high
        if: steps.numara.outputs.valida == 'true' && steps.numara.outputs.are_de_reparat == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create revizuire --color B60205 --description "Constatări ale revizuirii automate" 2>/dev/null || true
          gh issue create \
            --label revizuire \
            --title "Revizuire: ${{ steps.numara.outputs.critice }} critice, ${{ steps.numara.outputs.majore }} majore — $(git rev-parse --short "$GITHUB_SHA")" \
            --body-file "$DIR_RAPORT/corp.md"

      - name: Notificare WhatsApp
        if: always()
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          BUCATI: ${{ needs.triaj.outputs.bucati }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Secretele nu au voie în `if:`, deci verificarea se face aici.
          if [ -z "${CALLMEBOT_PHONE:-}" ] || [ -z "${CALLMEBOT_APIKEY:-}" ]; then
            echo "::warning title=WhatsApp neconfigurat::Lipsesc CALLMEBOT_PHONE / CALLMEBOT_APIKEY; raportul nu pleacă nicăieri."
            exit 0
          fi
          F="$DIR_RAPORT/findings.json"
          [ -s "$F" ] || { echo "::warning title=WhatsApp sărit::findings.json lipsește."; exit 0; }

          # Mesajul se construiește din JSON, nu prin parsarea markdown-ului.
          # Antetul spune ACUM peste ce a trecut noaptea — un singur SHA ar fi
          # mințit, fiindcă raportul acoperă toate commit-urile de la ultima
          # rulare, nu unul.
          MSG=$(jq -r \
            --arg varf "$(git rev-parse --short "$GITHUB_SHA")" \
            --arg buc "${BUCATI:-?}" \
            --arg url "$RUN_URL" '
            def sev(s): [.findings[]|select((.severitate//""|ascii_downcase)==s)];
            (sev("critical")) as $c | (sev("high")) as $h |
            (["🌙 Revizuire nocturnă — Administrativo",
              "\($buc) bucăți, până la \($varf)", ""]
             + (if ($c|length)>0 then ["🔴 Critical (\($c|length)):"] + ([$c[]|"• \(.titlu)"][0:3]) + [""] else [] end)
             + (if ($h|length)>0 then ["🟠 High (\($h|length)):"]     + ([$h[]|"• \(.titlu)"][0:3]) + [""] else [] end)
             + (if ($c|length)==0 and ($h|length)==0 then ["✅ Fără constatări critice sau majore."] else [] end)
             + [$url]
            ) | join("\n")' "$F")

          # Răspunsul CallMeBot se CITEȘTE. Pasul ăsta se termina cu
          # `>/dev/null || true`, deci o cheie invalidă — exact ce s-a întâmplat
          # la prima configurare — ar fi eșuat tăcut la fiecare rulare, iar
          # singurul simptom ar fi fost că nu vine niciun mesaj. Un canal de
          # notificare care poate muri fără să spună nimic nu e un canal.
          raspuns=$(curl -G -s --max-time 25 "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${CALLMEBOT_PHONE}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "apikey=${CALLMEBOT_APIKEY}" 2>&1) || raspuns="curl a eșuat"
          curat=$(printf '%s' "$raspuns" | sed 's/<[^>]*>//g' | tr -s ' \n' ' ')
          if printf '%s' "$curat" | grep -qi 'queued\|sent'; then
            echo "WhatsApp: trimis."
          else
            echo "::error title=WhatsApp NEtrimis::${curat:0:300}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raport-revizuire-${{ github.sha }}
          path: ${{ runner.temp }}/revizuire/
          retention-days: 30
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # 3. REPARARE — Opus repară critical/high și comite DIRECT pe main.
  # ───────────────────────────────────────────────────────────────────────────
  reparare:
    name: Reparare automată
    needs: [triaj, analiza]
    # `schedule`, nu `push` — declanșatorul s-a mutat. Fără schimbarea asta,
    # repararea automată n-ar mai fi pornit NICIODATĂ pe rularea nocturnă, și
    # tăcut: condiția s-ar fi evaluat pur și simplu la fals, iar jobul ar fi
    # apărut „skipped”, ceea ce arată la fel cu „n-a avut ce repara”.
    if: >-
      needs.analiza.outputs.are_de_reparat == 'true' &&
      (github.event_name == 'schedule' || inputs.repara)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      reparate: ${{ steps.rezultat.outputs.reparate }}
      sarite: ${{ steps.rezultat.outputs.sarite }}
    steps:
      # Vezi nota din jobul `analiza`: `runner.temp` nu e permis în `env:` de job.
      - name: Pregătește directorul de raport
        run: echo "DIR_RAPORT=$RUNNER_TEMP/revizuire" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          # Credențialul rămas în config e GITHUB_TOKEN. Spre deosebire de
          # claude-code-action, CLI-ul nu îl înlocuiește — deci push-ul de mai
          # jos NU re-declanșează workflow-ul.

      - name: Verifică dacă main s-a mișcat între timp
        id: ancora
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [ "$actual" = "$GITHUB_SHA" ]; then
            echo "putem=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Dacă main a avansat DOAR cu documentație, constatările se referă în
          # continuare la același cod: ne întoarcem la commit-ul revizuit și
          # continuăm. Vault-ul se sincronizează nocturn și publică singur, deci
          # fără excepția asta jobul de reparare ar fi picat sistematic din cauza
          # unui bot care n-a atins nicio linie de cod.
          if ! git diff --name-only "${GITHUB_SHA}..${actual}" | grep -qv '^\.claude/docs/'; then
            echo "::notice title=main a avansat doar cu vault::mă întorc la ${GITHUB_SHA} și repar."
            git reset --hard "$GITHUB_SHA"
            echo "putem=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A avansat cu COD. Reparația nu se mai poate aplica — dar asta nu e un
          # eșec al revizuirii, e o cursă normală când se împinge de două ori la
          # rând. Ieșim curat: `verdict` raportează oricum constatările rămase, iar
          # un ✗ roșu aici ar fi doar zgomot pe care omul învață să-l ignore.
          echo "::notice title=Reparare sărită::main a avansat de la ${GITHUB_SHA} la ${actual}; constatările se referă la alt cod."
          echo "putem=false" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.ancora.outputs.putem == 'true'
        with:
          name: raport-revizuire-${{ github.sha }}
          path: ${{ runner.temp }}/revizuire # NU în workspace: altfel raportul ar fi comis

      - uses: pnpm/action-setup@v4
        if: steps.ancora.outputs.putem == 'true'
      - uses: actions/setup-node@v4
        if: steps.ancora.outputs.putem == 'true'
        with:
          node-version: ${{ env.VERSIUNE_NODE }}
          cache: pnpm
      - if: steps.ancora.outputs.putem == 'true'
        run: pnpm install --frozen-lockfile

      - name: Amprenta de tipuri, ÎNAINTE de orice modificare
        if: steps.ancora.outputs.putem == 'true'
        run: |
          set -uo pipefail
          bash scripts/ci/tipuri-amprenta.sh > "${RUNNER_TEMP}/tipuri-baza.txt"
          echo "Linie de bază: $(wc -l < "${RUNNER_TEMP}/tipuri-baza.txt") erori de tip preexistente."

      - name: Instalează Claude Code
        if: steps.ancora.outputs.putem == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$VERSIUNE_CLAUDE"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Identitate git
        if: steps.ancora.outputs.putem == 'true'
        run: |
          git config user.name  "claude-revizuire[bot]"
          git config user.email "claude-revizuire[bot]@users.noreply.github.com"

      - name: Repară
        if: steps.ancora.outputs.putem == 'true'
        id: claude
        continue-on-error: true
        timeout-minutes: 35
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          PROMPT=$(cat <<PROMPT_EOF
          Ai de reparat constatările dintr-un review automat.

          Raportul: ${DIR_RAPORT}/raport.md
          Datele structurate: ${DIR_RAPORT}/findings.json
          Amprenta de tipuri de referință: ${RUNNER_TEMP}/tipuri-baza.txt

          ## Ce repari
          DOAR constatările cu \`severitate\` \`critical\` sau \`high\` ȘI
          \`reparabil_automat: true\`. Restul le ignori complet.

          ## Cum
          Pentru fiecare, în ordine — întâi critical, apoi high:
          1. Citește fișierul și contextul. Dacă nu înțelegi problema, SARI peste.
          2. Fă modificarea MINIMĂ care rezolvă exact acea constatare. Fără
             refactorizare, fără îmbunătățiri, fără funcționalități noi.
          3. Rulează \`pnpm prettier --write <fișierele atinse>\`.
          4. Adaugă explicit fișierele: \`git add -- <cale> <cale>\`.
             NICIODATĂ \`git add -A\` sau \`git add .\`.
          5. Un commit ATOMIC per constatare, cu mesajul:

             tip(scop): descriere scurtă (ID-ul constatării) [revizuire automata]

             Marcatorul \`[revizuire automata]\` e obligatoriu: el împiedică
             push-ul rezultat să declanșeze o nouă revizuire.

          ## Verificarea finală, obligatorie
          După TOATE reparațiile, o singură dată:
            bash scripts/ci/tipuri-amprenta.sh > "${RUNNER_TEMP}/tipuri-dupa.txt"
            bash scripts/ci/tipuri-compara.sh "${RUNNER_TEMP}/tipuri-baza.txt" "${RUNNER_TEMP}/tipuri-dupa.txt"

          \`pnpm typecheck\` e DEJA roșu pe main, cu erori preexistente cunoscute.
          Gate-ul nu e „zero erori", ci „nicio eroare în plus". Dacă scriptul de
          comparație iese cu 1, ai introdus erori noi: revino commit cu commit
          (\`git reset --hard HEAD~1\`, apoi re-verifică) până amprenta redevine
          curată. Commit-urile sunt atomice tocmai ca asta să fie posibil.

          Rulează și \`pnpm test\` la final. Dacă pică un test care trecea, revino
          la commit-ul vinovat.

          ## Ce NU faci
          - NU dai \`git push\` — o face un pas separat al workflow-ului.
          - NU modifici fișiere din supabase/migrations/ — nici măcar ca să repari.
          - NU modifici .env, secrete, sau src/types/database.ts (e generat).
          - NU atingi fișierele din ${DIR_RAPORT}.
          - Dacă TOATE constatările sunt sărite, nu comite nimic și spune asta clar.

          La final scrie în ${DIR_RAPORT}/reparate.json:
          {"reparate": ["C-1","H-2"], "sarite": [{"id":"H-1","motiv":"..."}]}
          PROMPT_EOF
          )

          claude -p "$PROMPT" \
            --model claude-opus-5 \
            --effort high \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash" \
            --disallowedTools "Bash(git push:*),Bash(git remote:*),Bash(gh:*)" \
            --add-dir "$DIR_RAPORT" --add-dir "$RUNNER_TEMP" \
            --max-turns 120 \
            --mcp-config '{"mcpServers":{}}' \
            --strict-mcp-config \
            --permission-mode acceptEdits \
            --output-format json \
            > "${RUNNER_TEMP}/sesiune-fix.json" 2>&1 || true
          exit 0

      - name: Verificare independentă a tipurilor
        if: steps.ancora.outputs.putem == 'true'
        id: verificare
        run: |
          set -uo pipefail
          bash scripts/ci/tipuri-amprenta.sh > "${RUNNER_TEMP}/tipuri-dupa.txt"
          if bash scripts/ci/tipuri-compara.sh "${RUNNER_TEMP}/tipuri-baza.txt" "${RUNNER_TEMP}/tipuri-dupa.txt"; then
            echo "curat=true" >> "$GITHUB_OUTPUT"
          else
            echo "curat=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Reparările au introdus erori de tip::Nu se publică nimic."
          fi

      - name: Publică reparările
        id: publica
        if: steps.verificare.outputs.curat == 'true'
        run: |
          set -euo pipefail
          if [ -z "$(git log --oneline "${GITHUB_SHA}..HEAD")" ]; then
            echo "Niciun commit de publicat."
            exit 0
          fi
          echo "Se publică:"
          git log --oneline "${GITHUB_SHA}..HEAD"
          git push origin HEAD:main

      - name: Renunță la reparări
        if: steps.ancora.outputs.putem == 'true' && steps.verificare.outputs.curat != 'true'
        run: |
          git reset --hard "$GITHUB_SHA"
          echo "S-a revenit la ${GITHUB_SHA}. Nimic nu a fost publicat."

      - name: Rezultat
        id: rezultat
        if: always()
        run: |
          set -uo pipefail
          R="$DIR_RAPORT/reparate.json"
          if [ -s "$R" ] && [ "${{ steps.verificare.outputs.curat }}" = "true" ]; then
            echo "reparate=$(jq -r '.reparate|length' "$R" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
            echo "sarite=$(jq -r '.sarite|length' "$R" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          else
            { echo "reparate=0"; echo "sarite=0"; } >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 4. VERDICT — stare distinctă pe commit + ✗ roșu la critical/high.
  # ───────────────────────────────────────────────────────────────────────────
  verdict:
    name: Verdict
    needs: [triaj, analiza, reparare]
    if: always() && needs.triaj.outputs.rulam == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publică starea și decide
        env:
          GH_TOKEN: ${{ github.token }}
          CRITICE: ${{ needs.analiza.outputs.critice }}
          MAJORE: ${{ needs.analiza.outputs.majore }}
          VALIDA: ${{ needs.analiza.outputs.valida }}
          REPARATE: ${{ needs.reparare.outputs.reparate }}
        run: |
          set -uo pipefail
          c=${CRITICE:-0}; m=${MAJORE:-0}; r=${REPARATE:-0}
          ramase=$(( c + m - r )); [ "$ramase" -lt 0 ] && ramase=0

          if [ "${VALIDA:-false}" != "true" ]; then
            stare=error; desc="Revizuirea nu a putut rula"
          elif [ "$ramase" -gt 0 ]; then
            stare=failure; desc="$ramase constatări critice/majore nereparate (din $((c+m)), reparate automat: $r)"
          else
            stare=success; desc="Fără constatări critice sau majore nereparate"
          fi

          # Stare cu NUME PROPRIU pe commit — distinctă de „CI", ca cele două
          # semnale să rămână citibile separat în lista de commit-uri.
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --method POST \
            -f state="$stare" -f context="revizuire/opus" -f description="$desc" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent

          echo "### Verdict revizuire" >> "$GITHUB_STEP_SUMMARY"
          echo "$desc" >> "$GITHUB_STEP_SUMMARY"

          # Job roșu la critical sau high rămase — alegere deliberată: ✗ pe
          # commit plus email de la GitHub. Vezi nota din documentație despre
          # riscul de obișnuință cu roșul.
          [ "$stare" = "failure" ] && exit 1
          exit 0
