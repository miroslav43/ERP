name: Staging

# DE CE `push` doar pe main, și nu pe orice ramură: runner-ul rulează pe VM și
# execută ce scrie în workflow, iar workflow-ul vine din repo. Limitarea la main
# e singurul lucru care stă între un PR dintr-un fork și shell-ul mașinii care
# servește toate cele zece site-uri.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  workflow_dispatch:

# Repo-ul e lucrat în paralel de mai multe sesiuni, care împing des. Fără asta,
# deploy-urile s-ar aduna la coadă și ar construi versiuni deja depășite.
concurrency:
  group: administrativo-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, administrativo]
    timeout-minutes: 30
    permissions:
      contents: write # pentru comentariul pe commit

    # `pipefail` NU e implicit în shell-ul pașilor. Fără el, `comandă | tee log`
    # întoarce codul lui `tee`, adică mereu 0 — și fiecare poartă de mai jos
    # devine decorativă.
    #
    # S-a întâmplat la prima rulare reală (33955571598): migrările au eșuat cu
    # „password authentication failed", deploy-ul n-a convers, iar workflow-ul a
    # raportat verde pe toată linia. Pagina de stare scria „a ajuns pe staging"
    # în timp ce serviciul era 0/2.
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      # Spațiu de lucru propriu al runner-ului, deci un arbore CURAT la exact
      # acest sha. Producția, în schimb, se construiește din directorul de lucru
      # partajat — unde poate exista muncă necomisă a altei sesiuni.
      - uses: actions/checkout@v4

      # Secretele NU trec prin GitHub. Stau pe VM, în afara repo-ului, și se
      # copiază la fiecare rulare — spațiul de lucru se rescrie oricum la
      # checkout, deci fișierul nu persistă.
      - name: Mediul de staging
        run: cp ~/.secrete/administrativo/.env.staging .env.staging

      # Pagina de stare începe să spună adevărul de ACUM, nu la final: altfel nu
      # poate răspunde la „mai rulează?" sau „unde a ajuns?". Fiecare pas de mai
      # jos își anunță începutul, iar pagina se reîmprospătează la 10 secunde cât
      # timp rularea e în curs.
      #
      # Mesajul și autorul commit-ului sunt TEXT SCRIS DE OM: trec prin `env:`,
      # niciodată interpolate direct în `run:`, altfel un mesaj de commit
      # meșterit ar executa comenzi pe VM.
      - name: Starea — pornire
        env:
          SHA: ${{ github.sha }}
          MESAJ: ${{ github.event.head_commit.message }}
          AUTOR: ${{ github.event.head_commit.author.name }}
          URL_RULARE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./administrativo.sh stare:incepe "$SHA" "$(printf '%s' "$MESAJ" | head -1)" "$AUTOR" "$URL_RULARE"

      - name: Dependențe
        run: |
          ./administrativo.sh stare:pas "Dependențe"
          pnpm install --frozen-lockfile

      # ── Poarta 1 ────────────────────────────────────────────────────────────
      # `pnpm verify` = typecheck + lint + format:check + teste. NU include
      # build — ăla vine în pasul de deploy, în `docker build`.
      - name: Poarta — verify
        id: verify
        run: |
          ./administrativo.sh stare:pas "Verificare (tipuri, lint, 3122 teste)"
          pnpm verify 2>&1 | tee ${{ runner.temp }}/verify.log

      # ── Poarta 2 ────────────────────────────────────────────────────────────
      # ÎNAINTE de a atinge orice bază: confirmă că baza spre care duce mediul
      # de staging chiar e a staging-ului.
      #
      # Nu e paranoia. Pe 2026-09-05, `ADM_MEDIU=staging ./administrativo.sh
      # db:status` raporta proiectul de PRODUCȚIE: `_load_env_db` încărca
      # hardcodat `.env.local` și nu se uita la `ADM_MEDIU`. Pasul de mai jos ar
      # fi aplicat DDL pe datele reale ale firmelor-client, automat, la fiecare
      # push în main.
      - name: Poarta — baza țintă e chiar a staging-ului
        run: |
          ./administrativo.sh stare:pas "Baza țintă e a staging-ului"
          bash scripts/checks/tinta-db.sh

      # ── Poarta 3 ────────────────────────────────────────────────────────────
      # Migrările merg pe baza de staging, un proiect Supabase SEPARAT de
      # producție. Dacă una pică, deploy-ul se oprește aici și eroarea psql
      # ajunge în rezumat; subdomeniul rămâne pe versiunea anterioară.
      - name: Poarta — migrări pe baza de staging
        id: migrari
        env:
          ADM_MEDIU: staging
          # `confirm()` refuză implicit în shell neinteractiv — corect, un deploy
          # automat nu trebuie să poată aplica migrări din greșeală. Excepția e
          # limitată prin construcție la mediile non-producție: aceeași variabilă
          # pusă pe producție NU are niciun efect (vezi ops/_lib.sh).
          ADM_CONFIRM_AUTO: "1"
        run: |
          ./administrativo.sh stare:pas "Migrări pe baza de staging"
          ./administrativo.sh db:migrate 2>&1 | tee ${{ runner.temp }}/migrari.log

      - name: Deploy
        id: deploy
        env:
          ADM_MEDIU: staging
        run: |
          ./administrativo.sh stare:pas "Build imagine + rolling update"
          ./administrativo.sh stack:deploy 2>&1 | tee ${{ runner.temp }}/deploy.log

      # `if: always()` de aici în jos: pașii ăștia sunt exact cei care contează
      # când ceva a picat.
      - name: Curățenie
        if: always()
        run: ./administrativo.sh curata 5

      - name: Starea — închidere
        if: always()
        env:
          REZULTAT: ${{ job.status }}
        run: |
          # Imaginea chiar deployată, citită din Swarm — nu presupusă din sha.
          # Dacă deploy-ul n-a ajuns să ruleze, comanda dă gol și pasul rămâne
          # fără linia de imagine, ceea ce e informația corectă.
          IMAGINE=$(docker service inspect administrativo-staging_administrativo-web-staging \
                      --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null \
                    | sed 's/@sha256:.*//' || true)
          ./administrativo.sh stare:termina "$REZULTAT" "$IMAGINE"

      - name: Rezumat
        if: always()
        env:
          # Scriptul citește `JOB_STATUS`. GitHub NU îl expune automat ca
          # variabilă de mediu — `job.status` există doar în context de expresie.
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/rezumat-staging.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Comentariu pe commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(bash .github/scripts/rezumat-staging.sh)"
